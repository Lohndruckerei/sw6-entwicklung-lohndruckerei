# Lohndruckerei – gemeinsame Shopware-6-Entwicklungsumgebung für alle Plugins
#
# Start/Stopp (in WSL, in diesem Ordner):
#   docker compose up -d
#   docker compose stop
#
# Neues Plugin: eine Zeile unter "volumes" ergänzen und `docker compose up -d` ausführen.
# Shop- und Datenbankdaten liegen in den benannten Volumes und bleiben beim Neuerstellen
# des Containers erhalten. Die Volume-Namen stammen aus der ersten Einrichtung
# (Projekt "lohndruckerei-sw6-plugins") und sind deshalb fest eingetragen.

name: sw6-entwicklung-lohndruckerei

services:
  shopware:
    image: lohndruckerei-sw6:2026-11-08
    container_name: shopware
    ports:
      - "80:80"
      - "3306:3306"
      - "8888:8888"
      - "9999:9999"
    environment:
      TZ: Europe/Berlin
      PHP_VERSION: "8.3"
      NODE_VERSION: "20"
      XDEBUG_ENABLED: "0"
      # Dockware-Cron: jede Minute scheduled-task:run und messenger:consume async/failed
      # (LieferLotse-Inbox-Abruf, Indexierung) – ohne Admin-Fenster
      SW_TASKS_ENABLED: "1"
    volumes:
      - db:/var/lib/mysql
      - shop:/var/www/html
      # Plugins (Projektordner in WSL)
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-mensura:/var/www/html/custom/plugins/LdMensura
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-lieferlotse:/var/www/html/custom/plugins/LdLieferLotse
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-vectura:/var/www/html/custom/plugins/LdVectura
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-ordo:/var/www/html/custom/plugins/LdOrdo
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-proba:/var/www/html/custom/plugins/LdProba
      - /home/gugelm/projekte/sw6-entwicklung-lohndruckerei/sw6-opus:/var/www/html/custom/plugins/LdOpus

volumes:
  db:
    name: lohndruckerei-sw6-plugins_db
  shop:
    name: lohndruckerei-sw6-plugins_shop
