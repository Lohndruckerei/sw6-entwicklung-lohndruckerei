# Einziger Weg in den Spiegel: vom Rechner (127.0.0.1) zu SOM und Mailpit.
server { listen 1234; location / { proxy_pass http://web:80; proxy_set_header Host $http_host; } }
server { listen 8025; location / { proxy_pass http://mailpit:8025; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } }
